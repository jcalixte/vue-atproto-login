# Publishing runs on a tag, with no npm token anywhere.
#
# npm trusted publishing swaps GitHub's short-lived OIDC token for a one-shot
# publish credential, which is why `id-token: write` is the only secret-like
# thing here. The trust is pinned to this repository AND to this filename, so
# renaming this file breaks publishing until the setting on npmjs.com is updated
# to match.
name: Publish

on:
  push:
    tags: ["v*"]
  # Manual fallback. Tag pushes on this repo are currently not spawning runs —
  # GitHub records the PushEvent and starts nothing — so a release can also be
  # kicked off by hand against an existing tag:
  #   gh workflow run publish.yml -f tag=v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: write # for the GitHub Release
  id-token: write # for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # One name for the tag whichever way the job was started.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with most Node images.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, and npm has no undo past 72 hours. Fail before that happens.
      - name: Check the tag matches package.json
        run: |
          tagged="${TAG#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag v$tagged does not match package.json $packaged" >&2
            exit 1
          fi

      - run: pnpm verify

      # A re-run against an already-published tag (npm has no undo, so tags get
      # re-dispatched by hand) must not hard-fail. Ask the registry whether this
      # exact name@version already exists and skip publishing if it does.
      - name: Check whether this version is already on npm
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already published $name@$version, skipping npm publish"
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      # `npm publish`, not `pnpm publish`: pnpm 11's OIDC handling is still
      # unreliable (pnpm/pnpm#11513). pnpm builds, npm ships.
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public

      # `create` fails if the release already exists, which is normal on a
      # re-run. Create only when missing so the job stays idempotent.
      - name: Create the GitHub Release if missing
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
